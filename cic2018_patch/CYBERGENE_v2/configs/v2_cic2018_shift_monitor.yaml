# RQ3 drift monitor + recalibration policies on cic2018
name: cic2018_shift_monitor
data: {kind: cic2018, path: data/CIC-IDS2018, version: "CSE-CIC-IDS2018 processed CSVs", sample_n: 300000, sample_seed: 0, per_file_cap: 400000}
dedup: exact
dedup_first: true
port_mode: onehot
standardize: true
seeds: 0-9
n_boot: 10000
max_fit_rows: 50000
alphas: [0.01, 0.05]
models: [isolation_forest, pca, hbos, ecod, autoencoder, kitnet_style]
tuning: {grid: random, n: 12, criterion: pseudo_anomaly}
temporal: {n_blocks: 5, fit_blocks: [0], label_blocks: [1]}
mart_delta: 0.01
ks_gamma: 0.02
recal_size: 2000
fa_reps: 50
