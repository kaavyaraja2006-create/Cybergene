# RQ1/RQ2 calibration transfer on nf_unsw
name: nf_unsw_calib_transfer
data: {kind: nf_unsw_v2, path: data/NF-UNSW-NB15-v2.csv, version: "NF-UNSW-NB15-v2", sample_n: 300000, sample_seed: 0}
dedup: exact
dedup_first: true
port_mode: onehot
standardize: true
seeds: 0-9
n_boot: 10000
max_fit_rows: 50000
alphas: [0.01, 0.05]
models: [isolation_forest, ocsvm, lof, autoencoder, pca, hbos, ecod, kitnet_style, logreg, lightgbm]
tuning: {grid: random, n: 12, criterion: pseudo_anomaly}
methods: [empirical, conformal, conformal_pac]
scenarios:
  - {kind: random}
  - {kind: lofo, min_support: 100}
  - {kind: temporal, n_blocks: 5, fit_blocks: [0], label_blocks: [1]}
