# RQ5 protocol sensitivity on unsw_train
name: unsw_train_protocol_sens
data: {kind: unsw, path: data/UNSW-NB15/UNSW_NB15_training-set.csv, version: "UNSW-NB15 training-set partition"}
dedup: exact
dedup_first: true
port_mode: onehot
standardize: true
seeds: 0-9
n_boot: 10000
max_fit_rows: 50000
alphas: [0.01, 0.05]
models: [isolation_forest, pca, hbos, ecod, autoencoder, kitnet_style]
dedup_variants: [{dedup_first: true}, {dedup_first: false}]
alpha: 0.05
