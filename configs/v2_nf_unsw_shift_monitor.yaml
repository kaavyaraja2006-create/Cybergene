# RQ3 drift monitor + recalibration policies on nf_unsw
name: nf_unsw_shift_monitor
data: {kind: nf_unsw_v2, path: data/NF-UNSW-NB15-v2.csv, version: "NF-UNSW-NB15-v2", sample_n: 300000, sample_seed: 0}
dedup: exact
dedup_first: true
port_mode: onehot
standardize: true
seeds: 0-9
n_boot: 10000
max_fit_rows: 50000
alphas: [0.01, 0.05]
models: [isolation_forest, pca, hbos, ecod, autoencoder, kitnet_style]
tuning: {grid: random, n: 12, criterion: pseudo_anomaly}
temporal: {n_blocks: 5, fit_blocks: [0], label_blocks: [1]}
mart_delta: 0.01
ks_gamma: 0.02
recal_size: 2000
fa_reps: 50
