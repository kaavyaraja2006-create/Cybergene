# RQ3 drift monitor + recalibration policies on unsw_train
name: unsw_train_shift_monitor
data: {kind: unsw, path: data/UNSW-NB15/UNSW_NB15_training-set.csv, version: "UNSW-NB15 training-set partition"}
dedup: exact
dedup_first: true
port_mode: onehot
standardize: true
seeds: 0-9
n_boot: 10000
max_fit_rows: 50000
alphas: [0.01, 0.05]
models: [isolation_forest, pca, hbos, ecod, autoencoder, kitnet_style]
tuning: {grid: random, n: 12, criterion: pseudo_anomaly}
temporal: {n_blocks: 5, fit_blocks: [0], label_blocks: [1]}
mart_delta: 0.01
ks_gamma: 0.02
recal_size: 2000
fa_reps: 50
