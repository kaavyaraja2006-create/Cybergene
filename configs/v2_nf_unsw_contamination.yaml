# RQ4 contamination of the calibration set on nf_unsw
name: nf_unsw_contamination
data: {kind: nf_unsw_v2, path: data/NF-UNSW-NB15-v2.csv, version: "NF-UNSW-NB15-v2", sample_n: 300000, sample_seed: 0}
dedup: exact
dedup_first: true
port_mode: onehot
standardize: true
seeds: 0-9
n_boot: 10000
max_fit_rows: 50000
alphas: [0.01, 0.05]
models: [isolation_forest, pca, hbos, ecod, autoencoder, kitnet_style]
tuning: {grid: random, n: 12, criterion: pseudo_anomaly}
eps: [0.0, 0.005, 0.01, 0.02, 0.05, 0.10]
methods: [empirical, conformal]
