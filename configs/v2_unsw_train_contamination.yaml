# RQ4 contamination of the calibration set on unsw_train
name: unsw_train_contamination
data: {kind: unsw, path: data/UNSW-NB15/UNSW_NB15_training-set.csv, version: "UNSW-NB15 training-set partition"}
dedup: exact
dedup_first: true
port_mode: onehot
standardize: true
seeds: 0-9
n_boot: 10000
max_fit_rows: 50000
alphas: [0.01, 0.05]
models: [isolation_forest, pca, hbos, ecod, autoencoder, kitnet_style]
tuning: {grid: random, n: 12, criterion: pseudo_anomaly}
eps: [0.0, 0.005, 0.01, 0.02, 0.05, 0.10]
methods: [empirical, conformal]
