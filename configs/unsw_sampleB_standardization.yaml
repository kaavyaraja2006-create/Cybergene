# RQ2: feature-standardisation ablation (paired by seed)
name: unsw_sampleB_standardization
data: {kind: unsw, path: data/UNSW-NB15/UNSW_NB15_training-set.csv, version: "set-me"}
dedup: exact
port_mode: onehot
legacy_contamination: [0.15]
seeds: 0-29
models: [isolation_forest, ocsvm, lof]
target_fprs: [0.05]
tune: false
n_boot: 10000
variants:
  - {name: standardized, standardize: true}
  - {name: unstandardized, standardize: false}
